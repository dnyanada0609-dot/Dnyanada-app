<!doctype html><html lang="mr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DNYANADA — Firebase Login Test</title><style>body{font-family:Arial,sans-serif;background:#edf3fa;margin:0;color:#182d4a}.wrap{max-width:430px;margin:32px auto;padding:20px}.panel{background:white;padding:25px;border-radius:16px;box-shadow:0 5px 20px #1a34521c}h1{font-size:22px;text-align:center}p{line-height:1.6}label{display:block;margin-top:14px;font-weight:bold}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #b9c6d5;border-radius:8px;font-size:16px;margin-top:6px}button{background:#1655aa;color:white;border:0;border-radius:8px;padding:13px;width:100%;font-size:16px;margin-top:18px}button:disabled{opacity:.6}.msg{margin-top:15px;white-space:pre-wrap}.hide{display:none}.muted{color:#65748a;font-size:13px}</style></head><body><main class="wrap"><section class="panel"><h1>DNYANADA Smart Teacher App</h1><p class="muted" style="text-align:center">Spark Plan — स्वतंत्र लॉगिन चाचणी</p><div id="login"><label>लॉगिन प्रकार</label><select id="kind" style="width:100%;padding:12px"><option value="teacher">शिक्षक (मोबाईल नंबर)</option><option value="admin">Admin (ईमेल)</option></select><label id="idlabel">10 अंकी मोबाईल नंबर</label><input id="identity" autocomplete="username" inputmode="numeric" placeholder="मोबाईल नंबर"><label>पासवर्ड</label><input id="password" type="password" autocomplete="current-password" placeholder="पासवर्ड"><button id="signin">लॉगिन करा</button></div><div id="logged" class="hide"><h2 id="welcome"></h2><p id="license"></p><button id="signout">लॉगआउट</button></div><div class="msg" id="message" role="status"></div></section><p class="muted">ही स्वतंत्र चाचणी आहे. विद्यमान APK, डेटा किंवा GitHub फाईल्समध्ये बदल केलेले नाहीत. शिक्षक खाते Firebase Authentication मधून Admin ने तयार करणे आवश्यक आहे.</p></main><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script>
const firebaseConfig={apiKey:'AIzaSyAeOvBJxwIRD6rjRdTa7Ay-C9fFwYlHB1Y',authDomain:'dnyanada-app-17c4a.firebaseapp.com',projectId:'dnyanada-app-17c4a',storageBucket:'dnyanada-app-17c4a.firebasestorage.app',messagingSenderId:'97980812707',appId:'1:97980812707:web:4eef6c18836d47ba9f9e16',measurementId:'G-SZLXHGV1TE'};
const $=id=>document.getElementById(id);const say=s=>$('message').textContent=s;
const diagnostic=()=>{const protocol=location.protocol; if(protocol==='content:'||protocol==='file:')say('सूचना: ही स्थानिक HTML फाईल आहे ('+protocol+'). Firebase लॉगिनसाठी HTTPS Hosting वर चाचणी करणे अधिक विश्वासार्ह आहे.');}; diagnostic();
window.addEventListener('unhandledrejection',e=>{say('तांत्रिक त्रुटी: '+(e.reason?.code||e.reason?.message||'Unknown error'));});
if(!window.firebase){say('Firebase SDK लोड झाले नाही. इंटरनेट तपासा.');}else{
firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.firestore();
$('kind').onchange=()=>{const teacher=$('kind').value==='teacher';$('idlabel').textContent=teacher?'10 अंकी मोबाईल नंबर':'Admin ईमेल';$('identity').placeholder=teacher?'मोबाईल नंबर':'Admin ईमेल';$('identity').inputMode=teacher?'numeric':'email';};
$('signin').onclick=async()=>{const kind=$('kind').value,raw=$('identity').value.trim(),pw=$('password').value;if(kind==='teacher'&&!/^[6-9][0-9]{9}$/.test(raw)){say('योग्य 10 अंकी मोबाईल नंबर टाका.');return;}if(!pw){say('पासवर्ड टाका.');return;}const email=kind==='teacher'?`m${raw}@login.dnyanada.invalid`:raw;try{$('signin').disabled=true;say('लॉगिन तपासत आहे...');await Promise.race([auth.signInWithEmailAndPassword(email,pw),new Promise((_,reject)=>setTimeout(()=>reject(Object.assign(new Error('Firebase कडून वेळेत उत्तर मिळाले नाही. HTTPS Hosting वर चाचणी करा.'),{code:'auth/timeout'})),15000))]);}catch(e){say(e.code==='auth/timeout'?'Firebase कडून 15 सेकंदांत उत्तर मिळाले नाही. ही फाईल HTTPS Hosting वर उघडून तपासा.':'लॉगिन अयशस्वी: '+(e.code||e.message));}finally{$('signin').disabled=false;}};
$('signout').onclick=()=>auth.signOut();
auth.onAuthStateChanged(async user=>{if(!user){$('logged').classList.add('hide');$('login').classList.remove('hide');return;}$('login').classList.add('hide');$('logged').classList.remove('hide');$('welcome').textContent='खाते तपासत आहे...';say('Firebase खाते जोडले. परवानगी तपासत आहे...');$('license').textContent='';try{const admin=await db.collection('admins').doc(user.uid).get();if(admin.exists&&admin.data().role==='admin'){$('welcome').textContent='Admin लॉगिन यशस्वी';$('license').textContent='Admin खाते ओळखले. शिक्षक खाते तयार करण्याचे पॅनेल पुढील टप्प्यात जोडायचे आहे.';say('');return;}const sub=await db.collection('subscriptions').doc(user.uid).get();const d=sub.exists?sub.data():null;const today=new Date().toISOString().slice(0,10);if(d&&d.status==='active'&&typeof d.startDate==='string'&&typeof d.endDate==='string'&&d.startDate<=today&&today<=d.endDate){$('welcome').textContent='शिक्षक लॉगिन यशस्वी';$('license').textContent='परवाना वैध: '+d.startDate+' ते '+d.endDate+'. ही चाचणी आहे; मुख्य ॲप अद्याप जोडलेले नाही.';say('');}else{$('welcome').textContent='परवाना उपलब्ध नाही';$('license').textContent='Admin कडून सक्रिय परवाना आवश्यक आहे.';say('या चाचणीत मुख्य ॲपचा प्रवेश दिलेला नाही.');}}catch(e){$('welcome').textContent='तपासणी अयशस्वी';$('license').textContent='Firestore नियम किंवा इंटरनेट तपासा.';say(e.code||e.message);}});
}
</script></body></html>
