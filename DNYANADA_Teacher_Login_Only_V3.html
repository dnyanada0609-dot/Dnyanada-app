<!doctype html><html lang="mr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DNYANADA शिक्षक लॉगिन चाचणी</title><style>body{font:16px system-ui,sans-serif;background:#edf5fc;margin:0;padding:25px 12px;color:#163a62}.card{max-width:430px;margin:45px auto;background:white;border-radius:18px;padding:24px;box-shadow:0 8px 25px #1232}h2{margin-top:0}label{display:block;margin-top:15px;font-weight:700}input{display:block;width:100%;box-sizing:border-box;padding:13px;margin-top:6px;border:1px solid #9aafc2;border-radius:9px;font:inherit}button{padding:12px 18px;background:#12659c;color:white;border:0;border-radius:9px;font:inherit;margin-top:18px;cursor:pointer}#status{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}</style></head><body><div class="card"><h2>DNYANADA शिक्षक लॉगिन</h2><p>₹199 सदस्यत्व तपासणी — स्वतंत्र चाचणी</p><form id="form"><label>ईमेल<input type="email" id="email" required autocomplete="username"></label><label>पासवर्ड<input type="password" id="password" required autocomplete="current-password"></label><button id="login" type="submit">लॉगिन करा</button></form><p id="status" role="status">HTTPS वेबसाइटवर ही चाचणी करा.</p><button id="logout" hidden>लॉगआउट</button></div><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id),msg=t=>$('status').textContent=t,clean=x=>String(x??'').trim().toLowerCase();const config={apiKey:'AIzaSyAeOvBJxwIRD6rjRdTa7Ay-C9fFwYlHB1Y',authDomain:'dnyanada-app-17c4a.firebaseapp.com',projectId:'dnyanada-app-17c4a',appId:'1:97980812707:web:4eef6c18836d47ba9f9e16'};const timeout=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error('वेळ संपली — Firebase प्रतिसाद मिळाला नाही.')),ms))]);let auth,db;try{if(!window.firebase)throw Error('Firebase स्क्रिप्ट लोड झाली नाही');firebase.initializeApp(config);auth=firebase.auth();db=firebase.firestore()}catch(e){msg('सुरुवातीची त्रुटी: '+e.message);return}const button=$('login');$('form').addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;msg('लॉगिन तपासत आहे...');try{const result=await timeout(auth.signInWithEmailAndPassword($('email').value.trim(),$('password').value),15000);msg('लॉगिन यशस्वी. सदस्यत्व तपासत आहे...');const uid=result.user.uid;const [t,s]=await timeout(Promise.all([db.collection('teachers').doc(uid).get(),db.collection('subscriptions').doc(uid).get()]),15000);if(!t.exists||!s.exists)throw Error('शिक्षक किंवा सदस्यत्वाची नोंद सापडली नाही');const td=t.data(),sd=s.data();const field=(o,k)=>o[k]??o[k+' ']??'';const teacherActive=clean(field(td,'status'))==='active';const subscriptionActive=clean(field(sd,'status'))==='active';const expiry=field(sd,'expiryDate');let valid=false;if(expiry?.toDate)valid=expiry.toDate().getTime()>=Date.now();else if(typeof expiry==='string'){const m=expiry.trim().match(/^(\d{1,2})[/-](\d{1,2})[/-](\d{4})$/);const date=m?new Date(+m[3],+m[2]-1,+m[1],23,59,59):new Date(expiry);valid=!isNaN(date.getTime())&&date.getTime()>=Date.now()}else if(expiry instanceof Date)valid=expiry.getTime()>=Date.now();msg(teacherActive&&subscriptionActive&&valid?'चाचणी यशस्वी: खाते आणि सदस्यत्व सक्रिय आहे.\nमुख्य APK अद्याप जोडलेला नाही.':'लॉगिन यशस्वी; परंतु खाते/सदस्यत्व पडताळणी अपूर्ण.\nशिक्षक सक्रिय: '+teacherActive+'\nसदस्यत्व सक्रिय: '+subscriptionActive+'\nमुदत वैध: '+valid);$('logout').hidden=false}catch(err){msg('त्रुटी: '+(err.code||'')+' '+err.message)}finally{button.disabled=false}});$('logout').onclick=async()=>{await auth.signOut();$('logout').hidden=true;msg('लॉगआउट झाले.')};})();
</script></body></html>
