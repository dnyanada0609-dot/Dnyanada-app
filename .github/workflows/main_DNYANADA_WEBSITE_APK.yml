name: Build Dnyanada Website APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--max-old-space-size=6144"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Prepare website-based Android app
        run: |
          set -euo pipefail
          mkdir -p www
          cat > www/index.html <<'HTMLEOF'
          <!doctype html><html lang="mr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>DNYANADA</title></head><body><p>DNYANADA वेबसाइट उघडत आहे...</p></body></html>
          HTMLEOF
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Dnyanada" "com.dnyanada.app" --web-dir www
          python3 - <<'PYEOF'
          import json
          from pathlib import Path
          p = Path('capacitor.config.json')
          cfg = json.loads(p.read_text(encoding='utf-8'))
          cfg['server'] = {
            'url': 'https://dnyanada-app-1df67.web.app/',
            'cleartext': False,
            'allowNavigation': ['dnyanada-app-1df67.web.app']
          }
          p.write_text(json.dumps(cfg, ensure_ascii=False, indent=2), encoding='utf-8')
          PYEOF
          npx cap add android
          cat << 'GRADLEEOF' >> android/app/build.gradle
          dependencies {
              implementation(platform("org.jetbrains.kotlin:kotlin-bom:1.8.22"))
          }
          GRADLEEOF
          python3 -m pip install pillow
          python3 - <<'PYEOF'
          import os, glob
          from PIL import Image
          logos = glob.glob('logo.*') + glob.glob('*.png') + glob.glob('*.jpg')
          if logos:
              img = Image.open(logos[0]).convert('RGBA')
              sizes = {'mipmap-mdpi':48,'mipmap-hdpi':72,'mipmap-xhdpi':96,'mipmap-xxhdpi':144,'mipmap-xxxhdpi':192}
              for folder, sz in sizes.items():
                  out_dir = f'android/app/src/main/res/{folder}'
                  os.makedirs(out_dir, exist_ok=True)
                  resized = img.resize((sz, sz), Image.Resampling.LANCZOS)
                  for name in ('ic_launcher.png','ic_launcher_round.png','ic_launcher_foreground.png'):
                      resized.save(f'{out_dir}/{name}')
          PYEOF
          test -s MainActivity.java || { echo 'Missing MainActivity.java'; exit 1; }
          mkdir -p android/app/src/main/java/com/dnyanada/app
          cp MainActivity.java android/app/src/main/java/com/dnyanada/app/MainActivity.java
          npx cap sync android
          chmod +x android/gradlew
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.DNYANADA_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing signing secret"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/dnyanada-release.jks
          test -s android/app/dnyanada-release.jks
      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.DNYANADA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DNYANADA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DNYANADA_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          cd android
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/android/app/dnyanada-release.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Dnyanada-Website-Signed-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
