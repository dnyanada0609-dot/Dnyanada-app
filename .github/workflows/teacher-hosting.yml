name: Deploy DNYANADA Teacher Website

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare and validate teacher website
        run: |
          set -euo pipefail
          mkdir -p www teacher-site
          cat \
            part1_CCE_Marks_Web_Print_Fix.txt \
            part2_CCE_Marks_Web_Print_Fix.txt \
            part3_CCE_Marks_Web_Print_Fix.txt \
            part4_CCE_Marks_Web_Print_Fix.txt \
            > www/index.html

          python3 dnyanada_login_cloud_fix.py
          python3 dnyanada_inject_gate.py
          python3 dnyanada_sanchayi_11page_print_fix.py
          python3 dnyanada_sanchayi_print_v2.py

          python3 - <<'PY'
          from pathlib import Path
          p = Path('www/index.html')
          s = p.read_text(encoding='utf-8')
          closing = '</body>'
          pos = s.lower().rfind(closing)
          if pos < 0:
              raise SystemExit('STOP: HTML closing body tag missing')
          tag = '<script src="/dnyanada_cloud_backup.js"></script>\n'
          if tag not in s:
              s = s[:pos] + tag + s[pos:]
          p.write_text(s, encoding='utf-8')
          if not s.lstrip().lower().startswith('<!doctype html>'):
              raise SystemExit('STOP: HTML document header missing')
          if s.lower().count('</body>') < 1 or not s.rstrip().lower().endswith('</html>'):
              raise SystemExit('STOP: HTML document ending invalid')
          print('Teacher HTML assembled and guarded injection completed')
          PY

          cp www/index.html teacher-site/index.html
          cp dnyanada_cloud_backup.js teacher-site/dnyanada_cloud_backup.js
          cp firebase.teacher.json firebase.json

          cp manifest.json teacher-site/manifest.json
          python3 -m pip install Pillow

          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          img = Image.open("logo.png").convert("RGBA")
          for size in (192, 512):
              img.resize((size, size), Image.Resampling.LANCZOS).save(f"teacher-site/icon-{size}.png")
          p = Path("teacher-site/index.html")
          s = p.read_text(encoding="utf-8")
          tag = '<link rel="manifest" href="/manifest.json">'
          if tag not in s:
              pos = s.lower().find("</head>")
              if pos < 0:
                  raise SystemExit("STOP: head tag missing")
              s = s[:pos] + tag + "\n" + s[pos:]
          p.write_text(s, encoding="utf-8")
          print("PWA setup completed")
          PY

      - name: Verify teacher hosting files
        run: |
          set -euo pipefail
          test -s teacher-site/index.html
          test -s teacher-site/dnyanada_cloud_backup.js
          test -s teacher-site/manifest.json
          ls -lh teacher-site/
          cat firebase.json

          python3 - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path("firebase.json").read_text())
          hosting = config["hosting"]
          assert hosting["site"] == "dnyanada-app-1df67", "Wrong hosting site"
          assert hosting["public"] == "teacher-site", "Wrong public directory"
          assert Path("teacher-site/index.html").stat().st_size > 0
          print("Teacher hosting files verified successfully")
          PY

      - name: Deploy teacher website
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DNYANADA }}
          projectId: dnyanada-app-17c4a
          channelId: live
          entryPoint: .

      - name: Verify live teacher website
        run: |
          set -euo pipefail
          for url in \
            https://dnyanada-app-1df67.web.app/ \
            https://dnyanada-app-1df67.firebaseapp.com/
          do
            echo "Checking $url"
            curl --fail --silent --show-error \
              --location --retry 5 --retry-all-errors \
              --retry-delay 10 --max-time 120 \
              "$url" -o /tmp/teacher-live.html
            test -s /tmp/teacher-live.html
            if grep -qi '<title>Page Not Found</title>' /tmp/teacher-live.html; then
              echo "ERROR: Firebase Page Not Found"
              exit 1
            fi
            echo "Website HTTP check successful: $url"
          done
          
