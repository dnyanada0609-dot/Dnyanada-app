name: Deploy DNYANADA Teacher Website

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare teacher website
        run: |
          set -e
          mkdir -p www teacher-site

          cat \
          part1_CCE_Marks_Web_Print_Fix.txt \
          part2_CCE_Marks_Web_Print_Fix.txt \
          part3_CCE_Marks_Web_Print_Fix.txt \
          part4_CCE_Marks_Web_Print_Fix.txt \
          > www/index.html

          python3 dnyanada_inject_gate.py

          
          
          python3 -c 'from pathlib import Path; p=Path("www/index.html"); s=p.read_text(encoding="utf-8"); i=s.lower().rfind("</body>"); assert i >= 0, "Closing body tag missing"; s=s[:i]+"<script src=\"/dnyanada_cloud_backup.js\"></script>"+s[i:]; p.write_text(s, encoding="utf-8")'
      
          cp www/index.html teacher-site/index.html
          cp dnyanada_cloud_backup.js teacher-site/dnyanada_cloud_backup.js
          cp firebase.teacher.json firebase.json

      - name: Deploy teacher website
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DNYANADA }}
          projectId: dnyanada-app-17c4a
          channelId: live
          entryPoint: .
          

