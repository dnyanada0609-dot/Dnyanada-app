name: Deploy Dnyanada Website to Firebase Hosting

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare admin and teacher login pages
        run: |
          set -e
          mkdir -p hosting-login/teacher/app
          cp DNYANADA_Admin_Panel_V5_Status_Fix.html hosting-login/index.html
          cp DNYANADA_Teacher_Login_Only_V3.html hosting-login/teacher/index.html

      - name: Assemble main app and inject login gate
        run: |
          set -e
          for part in part1_CCE_Three_Print_Relay_V5.txt part2_CCE_Three_Print_Relay_V5.txt part3_CCE_Three_Print_Relay_V5.txt part4_CCE_Three_Print_Relay_V5.txt; do
            test -s "$part" || { echo "Missing or empty: $part"; exit 1; }
          done
          mkdir -p www
          cat part1_CCE_Three_Print_Relay_V5.txt part2_CCE_Three_Print_Relay_V5.txt part3_CCE_Three_Print_Relay_V5.txt part4_CCE_Three_Print_Relay_V5.txt > www/index.html
          python3 dnyanada_inject_gate.py
          cp www/index.html hosting-login/teacher/app/index.html
          
          cp dnyanada_cloud_backup.js hosting-login/teacher/app/dnyanada_cloud_backup.js

      - name: Deploy Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DNYANADA }}
          channelId: live
          projectId: dnyanada-app-17c4a
          entryPoint: .
