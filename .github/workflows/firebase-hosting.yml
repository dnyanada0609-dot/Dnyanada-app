
name: Deploy Dnyanada Login to Firebase Hosting

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare login website
        run: |
          mkdir -p hosting-login
          cp DNYANADA_Admin_Panel_V5_Status_Fix.html hosting-login/index.html          mkdir -p hosting-login/teacher
          mkdir -p hosting-login/teacher
          cp DNYANADA_Teacher_Login_Only_V3.html hosting-login/teacher/index.html

      - name: Deploy Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DNYANADA }}
          channelId: live
          projectId: dnyanada-app-17c4a
          
          entryPoint: .
          
