name: Build Dnyanada APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--max-old-space-size=6144"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Join HTML Parts and Prepare Android
        run: |
          mkdir -p www
          for part in part1_CCE_Three_Print_Relay_V5.txt part2_CCE_Three_Print_Relay_V5.txt part3_CCE_Three_Print_Relay_V5.txt part4_CCE_Three_Print_Relay_V5.txt; do
            test -s "$part" || { echo "Missing or empty: $part"; exit 1; }
          done
          cat part1_CCE_Three_Print_Relay_V5.txt part2_CCE_Three_Print_Relay_V5.txt part3_CCE_Three_Print_Relay_V5.txt part4_CCE_Three_Print_Relay_V5.txt > www/index.html
          test -s www/index.html || exit 1
          python3 dnyanada_inject_gate.py
          # Include the optional cloud backup tool in the Android web assets.
          test -s dnyanada_cloud_backup.js || { echo "Missing dnyanada_cloud_backup.js"; exit 1; }
          cp dnyanada_cloud_backup.js www/dnyanada_cloud_backup.js
          python3 - << 'CLOUDEOF'
          from pathlib import Path
          p = Path('www/index.html')
          html = p.read_text(encoding='utf-8')
          tag = '<script src="dnyanada_cloud_backup.js" defer></script>'
          if tag not in html:
              pos = html.lower().rfind('</body>')
              if pos < 0:
                  raise SystemExit('Missing closing body tag')
              html = html[:pos] + tag + '\n' + html[pos:]
              p.write_text(html, encoding='utf-8')
          print('Cloud backup script linked in Android app')
          CLOUDEOF
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Dnyanada" "com.dnyanada.app" --web-dir www
          npx cap add android

          cat << 'GRADLEEOF' >> android/app/build.gradle
          dependencies {
              implementation(platform("org.jetbrains.kotlin:kotlin-bom:1.8.22"))
          }
          GRADLEEOF

          pip install pillow || true
          python3 - << 'PYEOF'
          import os, glob
          from PIL import Image
          logos = glob.glob("logo.*") + glob.glob("*.png") + glob.glob("*.jpg")
          if logos:
              img = Image.open(logos[0]).convert("RGBA")
              sizes = {"mipmap-mdpi":48,"mipmap-hdpi":72,"mipmap-xhdpi":96,"mipmap-xxhdpi":144,"mipmap-xxxhdpi":192}
              for folder, sz in sizes.items():
                  out_dir = f"android/app/src/main/res/{folder}"
                  os.makedirs(out_dir, exist_ok=True)
                  resized = img.resize((sz, sz), Image.LANCZOS)
                  resized.save(f"{out_dir}/ic_launcher.png")
                  resized.save(f"{out_dir}/ic_launcher_round.png")
                  resized.save(f"{out_dir}/ic_launcher_foreground.png")
          PYEOF

          test -s MainActivity.java || { echo "Missing MainActivity.java"; exit 1; }
          mkdir -p android/app/src/main/java/com/dnyanada/app
          cp MainActivity.java android/app/src/main/java/com/dnyanada/app/MainActivity.java

          npx cap sync android
          chmod +x android/gradlew

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.DNYANADA_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing DNYANADA_KEYSTORE_BASE64 secret"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/dnyanada-release.jks
          test -s android/app/dnyanada-release.jks

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.DNYANADA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DNYANADA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DNYANADA_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing keystore password"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing key alias"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing key password"; exit 1; }
          cd android
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/android/app/dnyanada-release.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Dnyanada-Signed-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
