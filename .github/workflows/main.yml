name: Build Dnyanada APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--max-old-space-size=6144"
      GRADLE_OPTS: "-Xmx4g -Dorg.gradle.daemon=false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

- name: Prepare and Optimize Web Files
        run: |
          mkdir -p temp_extract www
          # सर्व प्रकारच्या archive फाईल्स (zip, rar, 7z) उघडण्यासाठी 7z वापरा
          7z x App.zip -otemp_extract/ || unzip -o App.zip -d temp_extract/ || cp App.zip temp_extract/index.html
          
          HTML_FILE=$(find temp_extract -type f | head -n 1)
          cp "$HTML_FILE" www/index.html
          rm -rf temp_extract

          pip install pillow || true
          python3 -c '
          import re, base64, io
          try:
              from PIL import Image
              with open("www/index.html", "r", encoding="utf-8", errors="ignore") as f:
                  html = f.read()
              def shrink(m):
                  img = Image.open(io.BytesIO(base64.b64decode(m.group(1)))).convert("RGB")
                  buf = io.BytesIO()
                  img.save(buf, format="JPEG", quality=80, optimize=True)
                  return "data:image/jpeg;base64," + base64.b64encode(buf.getvalue()).decode("utf-8")
              new_html = re.sub(r"data:image/png;base64,([A-Za-z0-9+/=]+)", shrink, html)
              with open("www/index.html", "w", encoding="utf-8") as f:
                  f.write(new_html)
              print("Optimized HTML successfully")
          except Exception as e:
              print("Skipping optimization:", e)
          '
          '

      - name: Build Capacitor Android Project
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Dnyanada" "com.dnyanada.app" --web-dir www
          npx cap add android
          npx cap sync android
          chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dnyanada-Smart-Teacher-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
