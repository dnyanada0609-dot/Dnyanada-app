name: Build Dnyanada APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--max-old-space-size=6144"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Join HTML Parts and Build APK
        run: |
          mkdir -p www
                    cat part1_CCE_Native_Relay_V4.txt part2_CCE_Native_Relay_V4.txt part3_CCE_Native_Relay_V4.txt part4_CCE_Native_Relay_V4.txt > www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Dnyanada" "com.dnyanada.app" --web-dir www
          npx cap add android

          cat << 'EOF' >> android/app/build.gradle
          dependencies {
              implementation(platform("org.jetbrains.kotlin:kotlin-bom:1.8.22"))
          }
          EOF

          pip install pillow || true
          python3 - << 'PYEOF'
          import os, glob
          from PIL import Image
          logos = glob.glob("logo.*") + glob.glob("*.png") + glob.glob("*.jpg")
          if logos:
              img = Image.open(logos[0]).convert("RGBA")
              sizes = {"mipmap-mdpi":48,"mipmap-hdpi":72,"mipmap-xhdpi":96,"mipmap-xxhdpi":144,"mipmap-xxxhdpi":192}
              for folder, sz in sizes.items():
                  out_dir = f"android/app/src/main/res/{folder}"
                  os.makedirs(out_dir, exist_ok=True)
                  resized = img.resize((sz, sz), Image.LANCZOS)
                  resized.save(f"{out_dir}/ic_launcher.png")
                  resized.save(f"{out_dir}/ic_launcher_round.png")
                  resized.save(f"{out_dir}/ic_launcher_foreground.png")
          PYEOF

                cp MainActivity.java android/app/src/main/java/com/dnyanada/app/MainActivity.java
        
                                  
                  

          npx cap sync android
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dnyanada-Smart-Teacher-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
