name: Build Dnyanada APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--max-old-space-size=6144"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Join HTML Parts and Build APK
        run: |
          mkdir -p www
          cat part1.txt part2.txt part3.txt part4.txt > www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Dnyanada" "com.dnyanada.app" --web-dir www
          npx cap add android
          
          # १. Kotlin duplicate class एरर फिक्स करणे
          cat << 'EOF' >> android/app/build.gradle
          dependencies {
              implementation(platform("org.jetbrains.kotlin:kotlin-bom:1.8.22"))
          }
          EOF

          # २. Custom App Icon (logo.png / logo.jpg) सर्व Android साईझमध्ये लावणे
          pip install pillow || true
          python3 - << 'PYEOF'
          import os, glob
          from PIL import Image
          logos = glob.glob("logo.*") + glob.glob("*.png") + glob.glob("*.jpg")
          if logos:
              img = Image.open(logos[0]).convert("RGBA")
              sizes = {
                  "mipmap-mdpi": 48,
                  "mipmap-hdpi": 72,
                  "mipmap-xhdpi": 96,
                  "mipmap-xxhdpi": 144,
                  "mipmap-xxxhdpi": 192
              }
              for folder, sz in sizes.items():
                  out_dir = f"android/app/src/main/res/{folder}"
                  os.makedirs(out_dir, exist_ok=True)
                  resized = img.resize((sz, sz), Image.LANCZOS)
                  resized.save(f"{out_dir}/ic_launcher.png")
                  resized.save(f"{out_dir}/ic_launcher_round.png")
                  resized.save(f"{out_dir}/ic_launcher_foreground.png")
              print("Custom App Icon applied from:", logos[0])
          PYEOF

          # ३. Native Android PrintManager + Smart Back Button Handler जोडणे
          cat << 'EOF' > android/app/src/main/java/com/dnyanada/app/MainActivity.java
          package com.dnyanada.app;

          import android.content.Context;
          import android.os.Bundle;
          import android.print.PrintAttributes;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;
          import androidx.activity.OnBackPressedCallback;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              private WebView printWebView;
              private long backPressedTime = 0;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  // Android Native Print (PDF Save / Print / Share)
                  getBridge().getWebView().addJavascriptInterface(new Object() {
                      @JavascriptInterface
                      public void printHtml(final String html, final String title) {
                          runOnUiThread(() -> {
                              WebView webView = new WebView(MainActivity.this);
                              webView.getSettings().setJavaScriptEnabled(true);
                              webView.setWebViewClient(new WebViewClient() {
                                  @Override
                                  public void onPageFinished(WebView view, String url) {
                                      PrintManager printManager = (PrintManager) getSystemService(Context.PRINT_SERVICE);
                                      String jobName = (title != null && !title.isEmpty()) ? title : "Dnyanada_Report";
                                      PrintDocumentAdapter printAdapter = view.createPrintDocumentAdapter(jobName);
                                      printManager.print(jobName, printAdapter, new PrintAttributes.Builder().build());
                                      printWebView = null;
                                  }
                              });
                              webView.loadDataWithBaseURL("file:///android_asset/public/", html, "text/html", "UTF-8", null);
                              printWebView = webView;
                          });
                      }
                  }, "AndroidPrint");

                  // मोबाईल बॅक बटण दाबल्यास अ‍ॅप अचानक बंद न होता मागे जाणे
                  getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {
                      @Override
                      public void handleOnBackPressed() {
                          WebView wv = getBridge().getWebView();
                          if (wv != null && wv.canGoBack()) {
                              wv.goBack();
                          } else {
                              if (System.currentTimeMillis() - backPressedTime < 2000) {
                                  finish();
                              } else {
                                  backPressedTime = System.currentTimeMillis();
                                  Toast.makeText(MainActivity.this, "अ‍ॅपमधून बाहेर पडण्यासाठी पुन्हा बॅक दाबा", Toast.LENGTH_SHORT).show();
                              }
                          }
                      }
                  });
              }
          }
          EOF

          npx cap sync android
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dnyanada-Smart-Teacher-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
