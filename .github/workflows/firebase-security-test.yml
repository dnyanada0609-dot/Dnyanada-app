name: Test DNYANADA Firebase Rules (No Deploy)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare isolated emulator tests
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dnyanada-rules-test"
          cd "$RUNNER_TEMP/dnyanada-rules-test"
          cat > firebase.json <<'JSON'
          {"firestore":{"rules":"firestore.rules"},"emulators":{"firestore":{"host":"127.0.0.1","port":8080},"ui":{"enabled":false}}}
          JSON
          cat > firestore.rules <<'RULES'
          rules_version = '2';
          service cloud.firestore {
            match /databases/{database}/documents {
              function signedIn() { return request.auth != null; }
              function isAdmin() {
                return signedIn()
                  && exists(/databases/$(database)/documents/admins/$(request.auth.uid))
                  && get(/databases/$(database)/documents/admins/$(request.auth.uid)).data.role == 'admin';
              }
              match /teachers/{userId} {
                allow read: if signedIn() && (request.auth.uid == userId || isAdmin());
                allow create, update, delete: if isAdmin();
              }
              match /admins/{adminId} {
                allow read: if signedIn() && request.auth.uid == adminId;
                allow write: if false;
              }
              match /subscriptions/{subscriptionId} {
                allow read: if signedIn() && (request.auth.uid == subscriptionId || isAdmin());
                allow create, update, delete: if isAdmin();
              }
              match /subscription_plans/{planId} {
                allow read: if signedIn();
                allow write: if isAdmin();
              }
              match /subscription_payments/{paymentId} {
                allow read: if isAdmin();
                allow create: if isAdmin()
                  && request.resource.data.teacherUid is string
                  && request.resource.data.amount is number
                  && request.resource.data.amount >= 0
                  && request.resource.data.method in ['cash', 'upi', 'bank', 'complimentary']
                  && request.resource.data.recordedBy == request.auth.uid
                  && request.resource.data.kind == 'manual';
                allow update, delete: if false;
              }
              match /app_backups/{userId} {
                function validAccount() {
                  let teacher = get(/databases/$(database)/documents/teachers/$(userId)).data;
                  let subscription = get(/databases/$(database)/documents/subscriptions/$(userId)).data;
                  return teacher.status == 'active'
                    && subscription.status == 'active'
                    && subscription.startDate <= request.time
                    && request.time <= subscription.expiryDate;
                }
                allow read, write: if signedIn() && request.auth.uid == userId && validAccount();
                match /chunks/{chunkId} {
                  allow read, write: if signedIn() && request.auth.uid == userId && validAccount();
                }
              }
            }
          }
          RULES
          cat > test.mjs <<'JS'
          import { initializeTestEnvironment, assertSucceeds, assertFails } from '@firebase/rules-unit-testing';
          import { doc, getDocFromServer, setDoc, updateDoc, deleteDoc, Timestamp } from 'firebase/firestore';
          import { readFileSync } from 'node:fs';
          const env = await initializeTestEnvironment({projectId:'demo-dnyanada-rules',firestore:{host:'127.0.0.1',port:8080,rules:readFileSync('firestore.rules','utf8')}});
          const now = Date.now(), day = 86400000;
          const valid = {status:'active',startDate:Timestamp.fromMillis(now-day),expiryDate:Timestamp.fromMillis(now+day)};
          const cases = {
            active: ['active',valid],
            other: ['active',valid],
            disabled: ['inactive',valid],
            expired: ['active',{...valid, startDate:Timestamp.fromMillis(now-2*day),expiryDate:Timestamp.fromMillis(now-day)}],
            future: ['active',{...valid,startDate:Timestamp.fromMillis(now+day),expiryDate:Timestamp.fromMillis(now+2*day)}],
            suspended: ['active',{...valid,status:'inactive'}],
            missing: ['active',null],
            noteacher: [null,valid],
            badtype: ['active',{...valid,expiryDate:'tomorrow'}]
          };
          const root = (db,id)=>doc(db,'app_backups',id);
          const chunk = (db,id)=>doc(db,'app_backups',id,'chunks','sample');
          const db = uid=>env.authenticatedContext(uid).firestore();
          async function test(name,fn){await fn();console.log('PASS: '+name);}
          try {
            await env.withSecurityRulesDisabled(async ctx=>{
              const d=ctx.firestore();
              for(const [id,[teacher,subscription]] of Object.entries(cases)){
                if(teacher) await setDoc(doc(d,'teachers',id),{status:teacher});
                if(subscription) await setDoc(doc(d,'subscriptions',id),subscription);
                await setDoc(root(d,id),{schema:1,latestVersion:'legacy'});
                await setDoc(chunk(d,id),{payload:'synthetic-only'});
              }
              await setDoc(doc(d,'admins','admin'),{role:'admin'});
              await setDoc(doc(d,'subscription_payments','existing'),{amount:222});
            });
            await test('active owner backup and restore, including legacy metadata preservation',async()=>{
              const d=db('active');
              await assertSucceeds(setDoc(chunk(d,'active'),{payload:'test',version:'v2',index:0}));
              await assertSucceeds(setDoc(root(d,'active'),{scopedBackupV2:{latestVersion:'v2',chunkCount:1,schema:2}},{merge:true}));
              const snap=await assertSucceeds(getDocFromServer(root(d,'active')));
              if(snap.data().latestVersion!=='legacy'||snap.data().scopedBackupV2.latestVersion!=='v2')throw Error('metadata mismatch');
              await assertSucceeds(getDocFromServer(chunk(d,'active')));
            });
            for(const id of ['disabled','expired','future','suspended','missing','noteacher','badtype']){
              await test(id+' owner denied root/chunk reads and writes',async()=>{
                const d=db(id);
                for(const ref of [root(d,id),chunk(d,id)]){
                  await assertFails(getDocFromServer(ref)); await assertFails(setDoc(ref,{test:true},{merge:true}));
                }
              });
            }
            for(const [label,d] of [['other teacher',db('other')],['signed out',env.unauthenticatedContext().firestore()],['admin without ownership',db('admin')]]){
              await test(label+' denied access to active teacher backup',async()=>{
                for(const ref of [root(d,'active'),chunk(d,'active')]){
                  await assertFails(getDocFromServer(ref)); await assertFails(setDoc(ref,{test:true},{merge:true}));
                }
              });
            }
            await test('teacher cannot edit subscription or grant admin',async()=>{
              const d=db('active');
              await assertFails(updateDoc(doc(d,'subscriptions','active'),{expiryDate:Timestamp.fromMillis(now+10*day)}));
              await assertFails(updateDoc(doc(d,'teachers','active'),{status:'active'}));
              await assertFails(setDoc(doc(d,'admins','active'),{role:'admin'}));
            });
            await test('admin can manage teacher and subscription; cannot modify existing payment',async()=>{
              const d=db('admin');
              await assertSucceeds(updateDoc(doc(d,'teachers','active'),{status:'inactive'}));
              await assertSucceeds(updateDoc(doc(d,'subscriptions','active'),{status:'active'}));
              await assertFails(updateDoc(doc(d,'subscription_payments','existing'),{amount:0}));
              await assertFails(deleteDoc(doc(d,'subscription_payments','existing')));
              await assertSucceeds(setDoc(doc(d,'subscription_payments','new'),{teacherUid:'active',amount:222,method:'cash',recordedBy:'admin',kind:'manual'}));
            });
            await test('previously active teacher denied after deactivation',async()=>{
              await assertFails(getDocFromServer(root(db('active'),'active')));
            });
            console.log('ALL SECURITY TESTS PASSED. No live Firebase access or deploy.');
          } finally { await env.cleanup(); }
          JS
          npm init -y >/dev/null
          npm install --no-audit --no-fund firebase@11 @firebase/rules-unit-testing@4 firebase-tools@14
      - name: Run Firestore emulator security tests
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/dnyanada-rules-test"
          npx --no-install firebase emulators:exec --project demo-dnyanada-rules --only firestore 'node test.mjs'
